    <script>
      (() => {
        'use strict';

        const brandIconData = document
          .getElementById('herbert-bot-icon-data')
          .content.textContent.trim();
        const brandIconUrl = `data:image/png;base64,${brandIconData}`;
        document.getElementById('brand-icon').src = brandIconUrl;
        document.getElementById('favicon').href = brandIconUrl;
        document.getElementById('apple-touch-icon').href = brandIconUrl;

        const ROUTER_ENDPOINT =
          'https://script.google.com/macros/s/AKfycbw9flnyJ_v0rr0HYDt1EMzLsUnq6fS2ENGp8cJiQtM24o69wssavY7gPLzx4uQiF-62/exec';
        const title = document.getElementById('title');
        const status = document.getElementById('status');
        let finished = false;

        function showError(message) {
          if (finished) return;
          finished = true;
          title.textContent = '연결할 회의를 찾지 못했습니다';
          status.textContent = message;
        }

        window.herbertMeetingRouterCallback = (payload) => {
          if (finished) return;
          if (!payload || payload.ok !== true || typeof payload.url !== 'string') {
            showError('Calendar 일정을 확인한 뒤 다시 시도해 주세요.');
            return;
          }

          let target;
          try {
            target = new URL(payload.url);
          } catch (error) {
            showError('유효한 Google Meet 링크를 받지 못했습니다.');
            return;
          }

          if (target.protocol !== 'https:' || target.hostname !== 'meet.google.com') {
            showError('허용되지 않은 회의 주소입니다.');
            return;
          }

          finished = true;
          title.textContent = '회의로 이동합니다';
          status.textContent = 'Google Meet를 여는 중입니다.';
          window.location.replace(target.href);
        };

        if (ROUTER_ENDPOINT.startsWith('__')) {
          showError('회의 라우터가 아직 배포되지 않았습니다.');
          return;
        }

        const routerUrl = new URL(ROUTER_ENDPOINT);
        routerUrl.searchParams.set('_', String(Date.now()));

        const controller = new AbortController();
        const timeout = window.setTimeout(() => controller.abort(), 10000);

        window
          .fetch(routerUrl.href, {
            cache: 'no-store',
            credentials: 'omit',
            mode: 'cors',
            referrerPolicy: 'no-referrer',
            signal: controller.signal,
          })
          .then((response) => {
            if (!response.ok) throw new Error('Router request failed');
            return response.text();
          })
          .then((source) => {
            const match = source.match(
              /^herbertMeetingRouterCallback\(([\s\S]*)\);\s*$/
            );
            if (!match) throw new Error('Unexpected router response');
            window.herbertMeetingRouterCallback(JSON.parse(match[1]));
          })
          .catch((error) => {
            if (error.name === 'AbortError') {
              showError('응답 시간이 초과되었습니다. 잠시 후 다시 시도해 주세요.');
              return;
            }
            showError('회의 라우터에 연결하지 못했습니다.');
          })
          .finally(() => window.clearTimeout(timeout));
      })();
    </script>
